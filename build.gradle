plugins {
    // see https://fabricmc.net/develop/ for new versions
    id "fabric-loom" version "${loom_version}" apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id "net.neoforged.moddev" version "${mod_dev_gradle_version}" apply false
}

// Aggregated identity verification (spec.md: AC-1).
// Adds no build dependencies and only inspects the final shippable jars, so
// it works on any checkout that can produce the three loader jars. Loader
// builds must never wire back into this task, or the task graph would cycle.
tasks.register("verifyModIdentity") {
    group = "verification"
    description = "Verifies every shippable loader jar carries the Ping For It identity and no stale original-mod references."

    dependsOn(":fabric:build", ":forge:build", ":neoforge:build")

    doLast {
        def expectedModId = providers.gradleProperty("mod_id").get()
        def expectedModName = providers.gradleProperty("mod_name").get()
        def expectedArchiveName = providers.gradleProperty("archive_name").get()
        def expectedVersion = providers.gradleProperty("mod_version").get()
        def minecraftVersion = providers.gradleProperty("minecraft_version").get()
        def failures = new ArrayList<String>()

        ["fabric", "forge", "neoforge"].each { loader ->
            def libsDir = project(":${loader}").layout.buildDirectory.dir("libs").get().asFile
            def expectedJarName = "${expectedArchiveName}-${expectedVersion}-${loader}-${minecraftVersion}.jar"
            def shippable = libsDir.listFiles()?.findAll {
                it.isFile() && it.name == expectedJarName
            } ?: []
            if (shippable.size() != 1) {
                def all = libsDir.listFiles()?.findAll { it.isFile() && it.name.endsWith(".jar") }*.name ?: []
                failures << "[${loader}] expected exactly one shippable jar '${expectedJarName}' in ${libsDir}; found: ${all}"
                return
            }
            verifyLoaderJar(loader, shippable.first(), expectedModId, expectedModName, expectedVersion, failures)
        }

        if (!failures.isEmpty()) {
            throw new GradleException("verifyModIdentity failed:\n - " + failures.join("\n - "))
        }
        logger.lifecycle("verifyModIdentity: fabric/forge/neoforge jars carry the Ping For It identity (mod_id=${expectedModId}, mod_name=${expectedModName}, mod_version=${expectedVersion}).")
    }
}

def verifyLoaderJar(String loader, File jarFile, String modId, String modName, String modVersion, List<String> failures) {
    def zip = new java.util.zip.ZipFile(jarFile)
    try {
        def names = new ArrayList<String>()
        def entries = zip.entries()
        while (entries.hasMoreElements()) {
            names.add(entries.nextElement().name)
        }

        // 1. Resource namespace: new assets/<modId>, no leftover assets/pingwheel.
        if (!names.any { it == "assets/${modId}/" || it.startsWith("assets/${modId}/") }) {
            failures << "[${loader}] missing assets/${modId}/ namespace in ${jarFile.name}"
        }
        if (names.any { it == "assets/pingwheel/" || it.startsWith("assets/pingwheel/") }) {
            failures << "[${loader}] stale assets/pingwheel/ namespace in ${jarFile.name}"
        }

        // 2. Mixin config file name. Note: "..." interpolation produces a
        //    GString, whose equals() never matches a java.lang.String, so
        //    List.contains would always be false; convert to a real String.
        def mixinConfigName = "${modId}.mixins.json".toString()
        if (!names.contains(mixinConfigName)) {
            failures << "[${loader}] missing ${modId}.mixins.json in ${jarFile.name}"
        }
        if (names.contains("pingwheel.mixins.json")) {
            failures << "[${loader}] stale pingwheel.mixins.json in ${jarFile.name}"
        }

        // 3. Old network channel byte strings must be gone from every entry.
        names.each { name ->
            def bytes = zip.getInputStream(zip.getEntry(name)).bytes
            def text = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1).toLowerCase()
            ["ping-wheel-c2s", "ping-wheel-s2c"].each { oldChannel ->
                if (text.contains(oldChannel)) {
                    failures << "[${loader}] stale channel byte string '${oldChannel}' in ${jarFile.name}!/${name}"
                }
            }
        }

        // 4. Loader metadata: processed id/modId, name and version.
        switch (loader) {
            case "fabric":
                verifyFabricMetadata(zip, jarFile, modId, modName, modVersion, failures)
                break
            case "forge":
                verifyForgeMetadata(zip, jarFile, modId, modName, modVersion, failures)
                break
            case "neoforge":
                verifyNeoForgeMetadata(zip, jarFile, modId, modName, modVersion, failures)
                break
        }

        // 5. Manifest MixinConfigs follows the new mod id (when present).
        def manifestEntry = zip.getEntry("META-INF/MANIFEST.MF")
        if (manifestEntry != null) {
            def manifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
            def mixinConfigs = manifest.getMainAttributes().getValue("MixinConfigs")
            if (mixinConfigs != null && !mixinConfigs.contains("${modId}.mixins.json")) {
                failures << "[${loader}] manifest MixinConfigs '${mixinConfigs}' does not reference ${modId}.mixins.json in ${jarFile.name}"
            }
        }

        // 6. Lang/sounds files: no stale external pingwheel. / pingwheel: / ping-wheel / ping wheel
        //    display text (case-insensitive). Internal nx.pingwheel references are allowed
        //    (Java package / service identifiers); class files and internal packages are not scanned.
        names.findAll {
            (it.startsWith("assets/${modId}/lang/") && it.endsWith(".json")) || it == "assets/${modId}/sounds.json"
        }.each { name ->
            def text = new String(zip.getInputStream(zip.getEntry(name)).bytes, java.nio.charset.StandardCharsets.UTF_8).toLowerCase()
            def withoutInternal = text.replace("nx.pingwheel", "")
            if (withoutInternal.contains("pingwheel.") || withoutInternal.contains("pingwheel:")
                    || withoutInternal.contains("ping-wheel") || withoutInternal.contains("ping wheel")) {
                failures << "[${loader}] stale external pingwheel display text in ${jarFile.name}!/${name}"
            }
        }
    } finally {
        zip.close()
    }
}

def verifyFabricMetadata(java.util.zip.ZipFile zip, File jarFile, String modId, String modName, String modVersion, List<String> failures) {
    def entry = zip.getEntry("fabric.mod.json")
    if (entry == null) {
        failures << "[fabric] fabric.mod.json missing in ${jarFile.name}"
        return
    }
    def json = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry), "UTF-8")
    if (json.id != modId) {
        failures << "[fabric] fabric.mod.json id '${json.id}' != '${modId}'"
    }
    if (json.name != modName) {
        failures << "[fabric] fabric.mod.json name '${json.name}' != '${modName}'"
    }
    if (json.version != modVersion) {
        failures << "[fabric] fabric.mod.json version '${json.version}' != '${modVersion}'"
    }
    // Original-mod blocking is prohibited by product decision: fabric.mod.json
    // must not declare an incompatibility ('breaks') with the original mod.
    if (json.breaks != null && json.breaks.containsKey("pingwheel")) {
        failures << "[fabric] fabric.mod.json declares 'pingwheel' in breaks; original-mod incompatibility/dependency declarations must be absent by the current product decision"
    }
}

def verifyForgeMetadata(java.util.zip.ZipFile zip, File jarFile, String modId, String modName, String modVersion, List<String> failures) {
    def entry = zip.getEntry("META-INF/mods.toml")
    if (entry == null) {
        failures << "[forge] META-INF/mods.toml missing in ${jarFile.name}"
        return
    }
    def text = new String(zip.getInputStream(entry).bytes, java.nio.charset.StandardCharsets.UTF_8)
    // Original-mod blocking is prohibited by product decision: mods.toml must
    // not carry a dependency/conflict declaration on the original mod id.
    // Only 'modId = "pingwheel"' lines are matched, so internal nx.pingwheel
    // entrypoint values in other metadata lines cannot false-positive.
    def pingwheelModIdLine = text.readLines().find { it ==~ /\s*modId\s*=\s*"pingwheel"\s*(#.*)?/ }
    if (pingwheelModIdLine != null) {
        failures << "[forge] mods.toml contains 'modId = \"pingwheel\"', a dependency/conflict declaration against the original mod; original-mod incompatibility/dependency declarations must be absent by the current product decision"
    }
    def firstMod = parseTomlFirstModBlock(text)
    if (firstMod == null) {
        failures << "[forge] mods.toml missing [[mods]] block"
    } else {
        if (firstMod["modId"] != modId) {
            failures << "[forge] mods.toml modId '${firstMod["modId"]}' != '${modId}'"
        }
        if (firstMod["displayName"] != modName) {
            failures << "[forge] mods.toml displayName '${firstMod["displayName"]}' != '${modName}'"
        }
        if (firstMod["version"] != modVersion) {
            failures << "[forge] mods.toml version '${firstMod["version"]}' != '${modVersion}'"
        }
    }
}

def verifyNeoForgeMetadata(java.util.zip.ZipFile zip, File jarFile, String modId, String modName, String modVersion, List<String> failures) {
    def entry = zip.getEntry("META-INF/neoforge.mods.toml")
    if (entry == null) {
        failures << "[neoforge] META-INF/neoforge.mods.toml missing in ${jarFile.name}"
        return
    }
    def text = new String(zip.getInputStream(entry).bytes, java.nio.charset.StandardCharsets.UTF_8)
    // Original-mod blocking is prohibited by product decision: neoforge.mods.toml
    // must not carry a dependency/conflict declaration on the original mod id.
    // Only 'modId = "pingwheel"' lines are matched, so internal nx.pingwheel
    // entrypoint values in other metadata lines cannot false-positive.
    def pingwheelModIdLine = text.readLines().find { it ==~ /\s*modId\s*=\s*"pingwheel"\s*(#.*)?/ }
    if (pingwheelModIdLine != null) {
        failures << "[neoforge] neoforge.mods.toml contains 'modId = \"pingwheel\"', a dependency/conflict declaration against the original mod; original-mod incompatibility/dependency declarations must be absent by the current product decision"
    }
    def firstMod = parseTomlFirstModBlock(text)
    if (firstMod == null) {
        failures << "[neoforge] neoforge.mods.toml missing [[mods]] block"
    } else {
        if (firstMod["modId"] != modId) {
            failures << "[neoforge] neoforge.mods.toml modId '${firstMod["modId"]}' != '${modId}'"
        }
        if (firstMod["displayName"] != modName) {
            failures << "[neoforge] neoforge.mods.toml displayName '${firstMod["displayName"]}' != '${modName}'"
        }
        if (firstMod["version"] != modVersion) {
            failures << "[neoforge] neoforge.mods.toml version '${firstMod["version"]}' != '${modVersion}'"
        }
    }
}

def parseTomlFirstModBlock(String text) {
    return parseTomlFirstBlock(text, "mods")
}

def parseTomlFirstBlock(String text, String blockName) {
    def header = "[[${blockName}]]"
    def headerIdx = text.indexOf(header)
    if (headerIdx < 0) {
        return null
    }
    def after = text.substring(headerIdx + header.length())
    def nextBlock = after.indexOf("[[")
    def block = nextBlock >= 0 ? after.substring(0, nextBlock) : after
    def map = [:]
    block.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith("#")) {
            return
        }
        def kv = parseTomlKeyValue(trimmed)
        if (kv != null) {
            map[kv[0]] = kv[1]
        }
    }
    return map
}

def parseTomlKeyValue(String line) {
    def kv = line.split("#", 2)[0]
    def kvMatch = kv =~ /^\s*([A-Za-z0-9_]+)\s*=\s*(.+?)\s*$/
    if (!kvMatch.find()) {
        return null
    }
    def value = kvMatch.group(2).trim()
    if (value.startsWith('"') && value.endsWith('"')) {
        value = value.substring(1, value.length() - 1)
    }
    return [kvMatch.group(1), value]
}
