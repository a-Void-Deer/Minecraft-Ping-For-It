// 根项目只负责插件解析与聚合，真正的构建配置在：
//   buildSrc/src/main/groovy/multiloader-common.gradle  各模块共享约定
//   buildSrc/src/main/groovy/multiloader-loader.gradle  加载器模块约定
//   common/build.gradle / fabric/build.gradle            模块自身
// 目录形状与上游 fork 对齐（docs/restructure/00-plan.md）。
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// 显式的“构建全部可发布模块”入口（forge/neoforge 预留，不参与）。
tasks.register('buildAll') {
	group = 'build'
	description = 'Builds every shippable module (common + fabric today).'
	dependsOn(':common:build', ':fabric:build')
}
// 根项目不是 Loom 项目（plugins 里只有 apply false），所以根级**没有** runClient/runServer
// 任务：直接 > Task 'runServer' not found in root project 失败。Loom 只在 :fabric 里建它们。
// 这里注册转发别名，让 ./gradlew runClient / runServer 也能用；等价的显式写法始终可用：
//   ./gradlew :fabric:runClient
//   ./gradlew :fabric:runServer
// 注意：别名只是把 :fabric 的任务加进任务图，不会复制一份运行配置。
['runClient', 'runServer'].each { String runTaskName ->
	tasks.register(runTaskName) {
		group = 'fabric'
		description = "Alias for :fabric:" + runTaskName + " (the root project is not a Loom project)."
		dependsOn(':' + 'fabric:' + runTaskName)
	}
}
