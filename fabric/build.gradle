plugins {
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = archive_name
}

version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.fabricmc.net/') }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'pingforit' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir(rootProject.file('runs/fabric-client').absolutePath)
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir(rootProject.file('runs/fabric-server').absolutePath)
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation(project(':common')) {
        transitive = false
    }
}

// fabric.mod.json is generated from a template; only the version is expanded.
def generateModMetadata = tasks.register('generateModMetadata', Sync) {
    from 'src/main/templates/fabric.mod.json'
    into layout.buildDirectory.dir('generated/modMetadata')
    inputs.property 'version', project.version
    expand 'version': project.version
}
sourceSets.main.resources.srcDir(generateModMetadata.flatMap { it.destinationDirectory })

tasks.named('processResources') {
    dependsOn generateModMetadata

    // Fabric indexes a mod's resources only at the classpath entry that owns
    // fabric.mod.json. Merge common's assets/icon here as well as in the jar.
    from project(':common').sourceSets.main.resources
}

// Single-jar packaging: merge common classes; resources enter only through
// processResources above, so no duplicate entries.
jar {
    archiveClassifier = 'fabric-26.3'

    dependsOn project(':common').tasks.named('classes')
    from project(':common').sourceSets.main.output.classesDirs

    from(rootProject.file('LICENSE')) {
        rename { it + '_pingforit' }
    }
    from(rootProject.file('THIRD-PARTY-NOTICES.md'))
}

tasks.named('test') {
    enabled = false
}
