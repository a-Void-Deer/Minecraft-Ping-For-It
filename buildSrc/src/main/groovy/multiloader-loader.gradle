plugins {
    id "multiloader-common"
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(":common")) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ":common", configuration: "commonJava")
    commonResources project(path: ":common", configuration: "commonResources")
}

tasks.named("compileJava", JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    // Fabric uses Loom's generated intermediary refmap from the common
    // mixin config. Forge and NeoForge use their loader-local official-Mojmap
    // config instead, so do not copy the common config into those jars.
    from(configurations.commonResources) {
        if (project.name != "fabric") {
            exclude("${mod_id}.mixins.json")
        }
    }
}

tasks.named("javadoc", Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    // The mixin annotation processor must not run during javadoc generation:
    // it cannot resolve injection-point mappings from the javadoc classpath and
    // fails the build with "Unable to locate method mapping".
    options.addStringOption('-proc:none')
}

tasks.named("sourcesJar", Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources) {
        if (project.name != "fabric") {
            exclude("${mod_id}.mixins.json")
        }
    }
}
