plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDir = rootProject.file('runs/skeleton/forge-client')
        }
        server {
            workingDir = rootProject.file('runs/skeleton/forge-server')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

// Skeleton phase: no mod sources, no mod tests.
tasks.named('test') {
    enabled = false
}
