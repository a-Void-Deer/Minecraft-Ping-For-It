pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// 多模块布局，与上游 fork（Ping-for-it）的目录形状对齐：
//   common/  双端共用的业务与客户端逻辑（上游把 client 代码也放在 common 里）
//   fabric/  Fabric 加载器入口、平台实现、资源与 fabric.mod.json
//   forge/ neoforge/  预留目录，暂不参与构建（决策 D1：当前只交付 Fabric 端）
// 见 docs/restructure/00-plan.md。
rootProject.name = 'Ping-For-It'

include('common')
include('fabric')

// 预留（未启用）：等真正做 Forge/NeoForge 端时再取消注释，并补齐对应工具链。
