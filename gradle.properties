# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3

# Mod Properties
# 必须保持 x.x.x-pfi-qualifier 形式：ConfigHandler 的 PingForItVersion 解析器要求该格式，
# 普通 semver（如 1.0.0）会在 ServerConfig 静态初始化时抛 InvalidVersionException。
version=0.4.2-pfi-beta1
group=isharmla.mod

# Dependencies
fabric_api_version=0.165.0+26.3

# 布局说明：common/ 与 fabric/ 两个子项目共享以上属性（见 settings.gradle）。
