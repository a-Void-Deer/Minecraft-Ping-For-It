plugins {
    id "multiloader-loader"
    id "net.neoforged.moddev"
}

repositories {
    maven {
        name = "Create"
        url = uri("https://maven.createmod.net")
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(":common").file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty("neoforge.enabledGameTestNamespaces", mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir "src/generated/resources" }

def compiledMinecraft = tasks.named('createMinecraftArtifacts', net.neoforged.nfrtgradle.CreateMinecraftArtifacts).flatMap { it.compiledArtifact }
def compiledMinecraftResources = tasks.named('createMinecraftArtifacts', net.neoforged.nfrtgradle.CreateMinecraftArtifacts).flatMap { it.resourcesArtifact }

jar {
    archiveClassifier = "${project.name}-${minecraft_version}"
}

// Soft optional integration: these jars are needed only to compile the
// reflectively-loaded adapter. They are not shipped and no loader metadata
// dependency is declared, so a client without Create/Flywheel remains valid.
dependencies {
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    compileOnly "com.simibubi.create:create-1.21.1:${create_version}"

    // Keep NeoForge resolver tests on the same Minecraft/JUnit test classpath
    // used by the common behavioral tests. Simulated itself remains absent.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation files(compiledMinecraft)
    testRuntimeOnly files(compiledMinecraftResources)
    testRuntimeOnly "net.neoforged:neoforge:${neoforge_version}"
    testRuntimeOnly "net.neoforged.fancymodloader:loader:4.0.21"
    testImplementation "net.neoforged:mergetool:2.0.3:api"
    testImplementation "net.neoforged:minecraft-dependencies:1.21.1"
}

test {
    useJUnitPlatform()
}
