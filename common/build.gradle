plugins {
	id 'multiloader-common'
	id 'net.fabricmc.fabric-loom'
}

// 双端共用代码（对应上游 common 模块）。这里必须保持“服务端安全”：
// splitEnvironmentSourceSets 让 main 源集的编译类路径里没有客户端类，
// 任何 net.minecraft.client.* 的误用都会在编译期直接报错（与移植前的约束一致）。
loom {
	splitEnvironmentSourceSets()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
	compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly integrationJars
	// 方案 A：Distant Horizons 只用 compile-libs/ 里的独立 API jar 编译；
	// run/mods 的完整 DH jar 只作 dev 运行时，不再进编译类路径。
	compileOnly integrationApiJars
}

// M9-2 Simple Voice Chat：entrypoint 类 nx.pingwheel.common.integration.VoiceChatIntegration
// 在共享源集里，所以检查挂在 :common:compileJava 上。
attachIntegrationJarCheck('compileJava', 'voicechat-',
	'Missing compile-only jar for the Simple Voice Chat integration: put ' +
		'voicechat-fabric-2.6.27+26.3.jar (or voicechat-api-2.6.27.jar) into run/mods/ ' +
		'(https://modrinth.com/mod/simple-voice-chat)')
// M9-3 Distant Horizons（方案 A）：共享源集里的 DistantHorizonsIntegration 直接引用
// com.seibel.distanthorizons.api.*，所以编译期必须拿到独立 API jar。
attachIntegrationApiJarCheck('compileJava', 'DistantHorizonsApi-',
	'Missing compile-time API jar for the Distant Horizons integration: put ' +
		'DistantHorizonsApi-7.2.0.jar into compile-libs/ ' +
		'(https://cdn.modrinth.com/data/Xs0XTOVv/versions/LTP8vW3B/DistantHorizonsApi-7.2.0.jar)')
// common 只是库模块，不提供 dev 运行配置。Loom 会给每个 loom 项目自动生成 runClient/runServer，
// 若保留，根级 `./gradlew runClient` 会同时命中 :common:runClient 与 :fabric:runClient，
// 两个客户端抢同一个 run/ 目录。这里关掉，保证根级 runClient 只落到 :fabric。
// 显式写法始终可用：./gradlew :fabric:runClient
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
	enabled = false
}
// B6 离线测试基座（common/src/test/java）：用例由 tools/test-check.sh 用 JDK 25 直接
// javac/java 跑（nx.pingwheel.common.testing.TestRunner），**不经过 Gradle**。
// 本机没有网络、Gradle 缓存里没有任何 JUnit jar，所以 `test` 任务既拿不到测试框架、
// 也发现不到用例（Gradle 9 默认 failOnNoDiscoveredTests=true）——一旦把它交给
// `check`，用户的 `gradlew clean build` 就会挂。这里只关掉 test 任务：
// 不新增测试依赖、不往 build/check 里加任何任务，纯粹保住离线构建。
// 等能联网（或提供本地 JUnit jar）后，删掉这段再按 JUnit 正式接线。
tasks.matching { it.name == 'test' }.configureEach {
	enabled = false
}
