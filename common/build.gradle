plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.spongepowered.org/repository/maven-public') }
    maven { url = uri('https://maven.neoforged.net/releases') }
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://cursemaven.com') }
    maven { url = uri('https://maven.maxhenkel.de/repository/public') }
    maven { url = uri('https://maven.ryanhcode.dev/releases') }
}

neoForge {
    neoFormVersion = neo_form_version
}

// MDG attaches the Minecraft compile/runtime classpath to main by default;
// attach the same NeoForm 26.3 classpath to test so focused tests can compile
// and run without hand-built Minecraft jars.
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // Common/source compile dependencies (26.3).
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    // Temporary 1.21.1-era optional API coordinates (see task-18): these only
    // keep the legacy integration sources compiling while 26.3 artifacts are
    // being re-resolved. They are not a claim of 26.3 runtime compatibility.
    compileOnly "maven.modrinth:DistantHorizonsApi:${distanthorizons_api_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    compileOnly "curse.maven:ftbteams-404468:${ftbteams_version}"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_version}"

    // P0 test wiring: only the focused A1 presentation tests are enabled for now;
    // the full 188-test suite is triaged in P1/P2.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testCompileOnly 'org.ow2.asm:asm:9.10.1'
    testImplementation 'net.neoforged:mergetool:2.0.3:api'
    testImplementation 'net.neoforged:minecraft-dependencies:26.3'
}

test {
    useJUnitPlatform()
}

// P2-2E: run the full common test source set again; there is no include whitelist.
// P2-2C/BO/EO/EBG/EXT/C archive files stay in the source tree but are not compiled:
// they still reference removed render/presentation types and are tracked as 0-test archives.
sourceSets.test.java {
    // P2-2C render archives (3).
    exclude 'nx/pingwheel/common/render/WheelOpacityTest.java'
    exclude 'nx/pingwheel/common/render/WheelOverlayRendererLayoutTest.java'
    exclude 'nx/pingwheel/common/render/RenderColorPolicyTest.java'

    // BO archives (3).
    exclude 'nx/pingwheel/common/client/outline/BlockModelOutlineRouteModeIsolationTest.java'
    exclude 'nx/pingwheel/common/client/outline/BlockOutlineSelectionTest.java'
    exclude 'nx/pingwheel/common/client/outline/BlockModelOutlineRouteTest.java'

    // BO archives (3).
    exclude 'nx/pingwheel/common/client/outline/BlockOutlineStateTest.java'
    exclude 'nx/pingwheel/common/client/outline/BlockModelOutlineStateTest.java'
    exclude 'nx/pingwheel/common/client/outline/BlockModelRenderSeedTest.java'

    // BO archives (4).
    exclude 'nx/pingwheel/common/client/outline/BlockOutlineFrameStateTest.java'
    exclude 'nx/pingwheel/common/client/outline/BlockOutlineRenderTypeTest.java'
    exclude 'nx/pingwheel/common/client/outline/BlockDisplayPlacementTest.java'
    exclude 'nx/pingwheel/common/client/outline/BlockPresentationCoverageTrackerTest.java'

    // EO archives (4).
    exclude 'nx/pingwheel/common/client/outline/EntityOutlineSelectionTest.java'
    exclude 'nx/pingwheel/common/client/outline/EntityOutlineLocatorResolverTest.java'
    exclude 'nx/pingwheel/common/client/outline/EntityOutlineRenderDecisionTest.java'
    exclude 'nx/pingwheel/common/client/outline/EntityOutlineFrameStateTest.java'

    // EBG/EXT archives (4).
    exclude 'nx/pingwheel/common/client/outline/EntityBlockGeometryTransformTest.java'
    exclude 'nx/pingwheel/common/client/outline/EntityBlockGeometryRunnerTest.java'
    exclude 'nx/pingwheel/common/client/outline/ExternalBlockOutlineSelectionTest.java'
    exclude 'nx/pingwheel/common/client/outline/VoxelShapeRenderUtilTest.java'

    // C archives (17).
    exclude 'nx/pingwheel/common/client/outline/AabbOutlineMaskTest.java'
    exclude 'nx/pingwheel/common/client/outline/EntityBlockGeometrySourceRegistryTest.java'
    exclude 'nx/pingwheel/common/client/outline/EntityOutlineRunnerTest.java'
    exclude 'nx/pingwheel/common/client/outline/EntityOutlineSourceRegistryTest.java'
    exclude 'nx/pingwheel/common/client/outline/FabricWorldAwareBlockModelOutlineAdapterContractTest.java'
    exclude 'nx/pingwheel/common/client/outline/ForgeWorldAwareBlockModelOutlineAdapterContractTest.java'
    exclude 'nx/pingwheel/common/client/outline/WorldAwareBlockModelOutlineAdapterRegistryTest.java'
    exclude 'nx/pingwheel/common/client/outline/LevelRendererOutlineRequestTest.java'
    exclude 'nx/pingwheel/common/client/outline/OptionalGeometryClassSafetyTest.java'
    exclude 'nx/pingwheel/common/client/outline/OutlineOnlyBufferSourceTest.java'
    exclude 'nx/pingwheel/common/client/outline/FlywheelDiagnosticsTest.java'
    exclude 'nx/pingwheel/common/client/outline/FlywheelEnvironmentPolicyTest.java'
    exclude 'nx/pingwheel/common/client/outline/FlywheelMeshCacheTest.java'
    exclude 'nx/pingwheel/common/client/outline/FlywheelModelBudgetTest.java'
    exclude 'nx/pingwheel/common/client/outline/FlywheelRenderClockTest.java'
    exclude 'nx/pingwheel/common/client/outline/FlywheelSilhouetteMaskTest.java'
    exclude 'nx/pingwheel/common/client/outline/FlywheelTransformMathTest.java'
}

// P1-1..P1-3D focused tests are enabled; full-suite restoration is P2.
tasks.named('test') {
    enabled = true
}

// common is a library module; do not create competing runClient/runServer tasks.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    enabled = false
}