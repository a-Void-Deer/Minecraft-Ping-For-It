plugins {
    id "multiloader-common"
    id "net.neoforged.moddev"
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// The merged+compiled Minecraft jar is wired only into the main
// compileClasspath by moddev. The network tests need the same classes to
// construct FriendlyByteBuf instances, so add the compiled artifact and
// Minecraft's own runtime dependency set to the test classpath as well.
def compiledMinecraft = tasks.named('createMinecraftArtifacts', net.neoforged.nfrtgradle.CreateMinecraftArtifacts).flatMap { it.compiledArtifact }

// The component JSON codec tests run the vanilla registry bootstrap, whose
// CreativeModeTabs validation resolves translated display names through
// Language.loadDefault(), which reads /assets/minecraft/lang/en_us.json from
// the classpath. That resource lives in the moddev resources artifact (not in
// the compiled jar), so wire it into the test runtime classpath as well.
def compiledMinecraftResources = tasks.named('createMinecraftArtifacts', net.neoforged.nfrtgradle.CreateMinecraftArtifacts).flatMap { it.resourcesArtifact }

dependencies {
    compileOnly group:"org.spongepowered", name:"mixin", version:"0.8.5"
    implementation group: "com.google.code.findbugs", name: "jsr305", version: "3.0.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    // Mergetool already supplies ASM on the test runtime classpath; expose the
    // same existing core artifact to javac for compiled-bytecode invariant tests.
    testCompileOnly "org.ow2.asm:asm:9.5"
    testImplementation files(compiledMinecraft)
    testRuntimeOnly files(compiledMinecraftResources)

    // The compiled (merged) Minecraft jar marks client-only classes with
    // runtime-retained @OnlyIn annotations whose value references the
    // NeoForge distmarker API. The block outline shape tests load client-only
    // classes (PoseStack, VertexConsumer, ...), so javac needs the distmarker
    // classes on the test classpath as well. The mergetool api jar — the same
    // artifact the main compileClasspath receives transitively via neoform —
    // provides exactly that and shadows no Minecraft classes.
    testImplementation "net.neoforged:mergetool:2.0.3:api"

    // Minecraft's full runtime library set (netty, datafixerupper, guava,
    // ...) with versions aligned to 1.21.1. Declaring this as a test
    // implementation dependency lets Netty and the other libraries that
    // FriendlyByteBuf references follow Minecraft's own dependency metadata
    // instead of pinning a Netty version by hand.
    testImplementation "net.neoforged:minecraft-dependencies:1.21.1"
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
