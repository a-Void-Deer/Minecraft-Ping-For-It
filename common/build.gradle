plugins {
    id "multiloader-common"
    id "org.spongepowered.gradle.vanilla" version "0.2.1-SNAPSHOT"
}

minecraft {
    version(minecraft_version)
}

// VanillaGradle wires Minecraft into the main source set. Tests inherit the
// same resolved Minecraft jar and its runtime library set explicitly.



dependencies {
    compileOnly group:"org.spongepowered", name:"mixin", version:"0.8.5"
    implementation group: "com.google.code.findbugs", name: "jsr305", version: "3.0.1"

    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testCompileOnly "org.ow2.asm:asm:9.5"
    testRuntimeOnly "org.ow2.asm:asm:9.5"
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
